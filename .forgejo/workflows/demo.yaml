name: Static Code Analysis

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: codeberg-small
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Python
        uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install godot-gdscript-toolkit
        run: pip install godot-gdscript-toolkit

      - name: Run static analysis with gdlint
        run: gdlint .